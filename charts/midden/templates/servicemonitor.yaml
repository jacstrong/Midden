{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- if not $sm.tokenSecret.name }}
{{- fail "metrics.serviceMonitor.tokenSecret.name is required: /api/metrics needs an admin's API token" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "midden.fullname" . }}
  labels:
    {{- include "midden.labels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "midden.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /api/metrics
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ $sm.tokenSecret.name }}
          key: {{ $sm.tokenSecret.key }}
{{- end }}
