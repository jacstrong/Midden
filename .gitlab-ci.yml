# Thin caller around scripts/ci-*.sh so this pipeline and GitHub Actions stay identical.
stages: [test, image, release]

variables:
  DOCKER_TLS_CERTDIR: '/certs'
  IMAGE: $CI_REGISTRY_IMAGE

.node:
  image: node:24
  before_script:
    - corepack enable
    # nmap validates every command the scan builder generates
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nmap || true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store, e2e/.cache/ms-playwright]

test:
  extends: .node
  stage: test
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/e2e/.cache/ms-playwright
  script:
    - scripts/ci-test.sh
  artifacts:
    when: always
    paths:
      - packages/web/dist-standalone/index.html
      - e2e/playwright-report
    expire_in: 2 weeks

.docker:
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use --name midden || docker buildx use midden

image:
  extends: .docker
  stage: image
  script:
    - scripts/ci-build-image.sh "$IMAGE" ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  extends: .docker
  stage: release
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - VERSION="${CI_COMMIT_TAG#v}"
    - scripts/ci-build-image.sh "$IMAGE" "$VERSION" --push
    - scripts/ci-build-image.sh "$IMAGE" latest --push
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

release-assets:
  extends: .node
  stage: release
  needs: [test]
  script:
    - scripts/ci-release-assets.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    paths: [release]
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Midden $CI_COMMIT_TAG'
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
