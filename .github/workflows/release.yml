name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap
      - run: SKIP_E2E=1 scripts/ci-test.sh
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: scripts/ci-build-image.sh "${{ steps.img.outputs.image }}" "${{ steps.img.outputs.version }}" --push
      - run: scripts/ci-build-image.sh "${{ steps.img.outputs.image }}" latest --push
      - run: scripts/ci-release-assets.sh "${{ steps.img.outputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
